<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CONIG | Registro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
 rel="stylesheet"
 integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
 crossorigin="anonymous">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/styles.css" rel="stylesheet">
</head>
<body>
<main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
  <div class="card panel-card w-100" style="max-width:540px">
    <div class="card-body p-4">
      <h1 class="h3 fw-bold mb-1">Crear cuenta</h1>
      <p class="text-secondary">Únete a la comunidad CONIG.</p>
      <form id="registerForm">
        <div class="mb-3">
          <label class="form-label">Nombre de usuario</label>
          <input class="form-control" name="username" maxlength="30" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Correo electrónico</label>
          <input class="form-control" type="email" name="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Nombre visible</label>
          <input class="form-control" name="displayName" maxlength="40">
        </div>
        <div class="mb-3">
          <label class="form-label">Biografía</label>
          <textarea class="form-control" name="bio" maxlength="160" rows="2"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input class="form-control" type="password" name="password" minlength="8" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Fotografía de perfil (obligatoria)</label>
          <input class="form-control" type="file" name="avatar"
            accept="image/jpeg,image/png,image/webp" required>
        </div>
        <p id="formMessage" class="small text-danger"></p>
        <button class="btn btn-primary w-100" type="submit">Crear cuenta</button>
      </form>
      <p class="text-center small mt-3 mb-0">
        ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
      </p>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
