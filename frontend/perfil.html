<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CONIG | Perfil</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
 rel="stylesheet"
 integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
 crossorigin="anonymous">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/styles.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
  <div class="container main-container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
      <span class="brand-mark">C</span> CONIG
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <div class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
        <a class="nav-link" href="index.html"><i class="bi bi-house"></i> Inicio</a>
        <a class="nav-link" href="perfil.html"><i class="bi bi-person"></i> Perfil</a>
        <a class="nav-link" href="mensajes.html"><i class="bi bi-chat"></i> Mensajes</a>
        <a class="nav-link" href="admin.html"><i class="bi bi-speedometer2"></i> Administración</a>
        <button class="btn btn-outline-secondary btn-sm ms-lg-2" data-logout>
          Cerrar sesión
        </button>
      </div>
    </div>
  </div>
</nav>
<main class="container main-container py-4">
  <h1 class="page-title h3 mb-4">Mi perfil</h1>
  <div class="card panel-card mb-4">
    <div class="card-body d-flex flex-wrap align-items-center gap-4">
      <div class="brand-mark display-4" id="avatarPlaceholder"><i class="bi bi-person"></i></div>
      <img id="profileAvatar" class="profile-avatar d-none" alt="Fotografía de perfil">
      <div>
        <h2 class="h4 fw-bold mb-1" id="profileName">Cargando...</h2>
        <p class="text-secondary mb-1" id="profileUsername"></p>
        <p id="profileBio" class="mb-1"></p>

        <div class="mt-2">
          <strong id="followersCount">0</strong> seguidores ·
          <strong id="followingCount">0</strong> seguidos
        </div>
      </div>
    </div>
  </div>
  <div class="card panel-card">
    <div class="card-body">
      <h2 class="h5 fw-bold">Personas que podrías conocer</h2>
      <div id="recommendations" class="text-secondary">Cargando recomendaciones...</div>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
