<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CONIG | Iniciar sesión</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
 rel="stylesheet"
 integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
 crossorigin="anonymous">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/styles.css" rel="stylesheet">
</head>
<body>
<main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
  <div class="card panel-card w-100" style="max-width:440px">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="brand-mark mx-auto mb-3">C</div>
        <h1 class="h3 fw-bold">Bienvenido a CONIG</h1>
        <p class="text-secondary">Inicia sesión en tu red social</p>
      </div>
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">Usuario o correo</label>
          <input class="form-control" name="identifier" required autocomplete="username">
        </div>
        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input class="form-control" type="password" name="password" required autocomplete="current-password">
        </div>
        <p id="formMessage" class="small text-danger"></p>
        <button class="btn btn-primary w-100" type="submit">Iniciar sesión</button>
      </form>
      <p class="text-center small mt-4 mb-0">
        ¿No tienes cuenta? <a href="registro.html">Regístrate</a>
      </p>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
