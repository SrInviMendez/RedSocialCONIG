<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CONIG | Mensajes</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/styles.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
  <div class="container main-container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="index.html"><span class="brand-mark">C</span> CONIG</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="mainNav">
      <div class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
        <a class="nav-link" href="index.html"><i class="bi bi-house"></i> Inicio</a>
        <a class="nav-link" href="perfil.html"><i class="bi bi-person"></i> Perfil</a>
        <a class="nav-link" href="sugerencias.html"><i class="bi bi-people"></i> Sugerencias</a>
        <a id="adminNavLink" class="nav-link d-none" href="admin.html"><i class="bi bi-shield-lock"></i> Administración</a>
        <a class="nav-link active" href="mensajes.html"><i class="bi bi-chat"></i> Mensajes <span id="messageNavBadge" class="message-nav-badge d-none">0</span></a>
        <button class="btn btn-outline-secondary btn-sm ms-lg-2" data-logout>Cerrar sesión</button>
      </div>
    </div>
  </div>
</nav>
<main class="container main-container py-4">
  <h1 class="page-title h3 mb-4">Mensajes privados</h1>
  <div class="row g-3">
    <aside class="col-md-4">
      <div class="card panel-card">
        <div class="card-body">
          <div class="d-flex gap-2 mb-3">
            <button id="showConversationsTab" class="btn btn-sm btn-primary" type="button">Conversaciones</button>
            <button id="showFollowingTab" class="btn btn-sm btn-outline-primary" type="button">Iniciar chat</button>
          </div>
          <div id="conversationList">Cargando conversaciones...</div>
          <div id="followingList" class="d-none">Cargando personas que sigues...</div>
        </div>
      </div>
    </aside>
    <section class="col-md-8">
      <div class="card panel-card">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center gap-2 mb-2">
            <h2 id="chatTitle" class="h6 fw-bold mb-0">Chat</h2>
            <div id="chatActions" class="dropdown d-none">
              <button class="btn btn-light btn-sm" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Opciones del chat"><i class="bi bi-three-dots-vertical"></i></button>
              <ul class="dropdown-menu dropdown-menu-end"><li><button id="deleteChatButton" class="dropdown-item text-danger" type="button">Borrar chat</button></li></ul>
            </div>
          </div>
          <div id="conversationNotice" class="mb-3"></div>
          <div id="messageHistory" class="message-history mb-3">Selecciona una conversación para ver los mensajes.</div>
          <form id="messageForm" class="d-flex gap-2">
            <input class="form-control" name="content" maxlength="2000" placeholder="Escribe un mensaje..." autocomplete="off" required>
            <button class="btn btn-primary" type="submit" aria-label="Enviar mensaje"><i class="bi bi-send"></i></button>
          </form>
        </div>
      </div>
    </section>
  </div>
  <div class="modal fade" id="profilePromptModal" tabindex="-1" aria-labelledby="profilePromptModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 rounded-4">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="profilePromptModalLabel">Ir al perfil</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <p class="mb-1">¿Quieres ir al perfil de la persona?</p>
          <strong id="profilePromptName"></strong>
          <p id="profilePromptUsername" class="text-secondary small mb-0"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button id="profilePromptConfirm" type="button" class="btn btn-primary" data-bs-dismiss="modal">Ver perfil</button>
        </div>
      </div>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/messages.js"></script>
</body>
</html>
